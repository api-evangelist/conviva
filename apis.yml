apis:
- aid: conviva:metrics-v3
  name: Conviva Metrics V3 API
  description: Programmatic access to historical and real-time Conviva experience metrics by metric name,
    with optional group-by dimensions, saved or dimensional filters, KPI thresholds and sorting. Historical
    requests run against /insights/3.0/metrics (up to 90 days, PT1H default granularity); real-time runs
    against /insights/3.0/real-time-metrics (up to 15 minutes, PT1M default granularity).
  humanURL: https://docs.conviva.ai/api/apis/conviva-vsi-api/metrics-v3-api-guide/
  baseURL: https://api.conviva.com/insights/3.0/metrics
  tags:
  - Metrics
  - Analytics
  - Video
  properties:
  - type: Documentation
    url: https://docs.conviva.ai/api/apis/conviva-vsi-api/metrics-v3-api-guide/
  - type: RateLimits
    url: rate-limits/conviva-rate-limits.yml
- aid: conviva:sessions-v3
  name: Conviva Sessions V3 API
  description: Session-level detail for content and ad sessions, including per-viewer session diagnostics,
    network_info with IPv4/IPv6, and summary metrics. Endpoints cover /sessions/content, /sessions/ad and
    their /viewer variants, capped at 500 sessions per response via ?limit={N}.
  humanURL: https://docs.conviva.ai/api/apis/conviva-vsi-api/sessions-v3-api/
  baseURL: https://api.conviva.com/insights/3.0/sessions
  tags:
  - Sessions
  - Diagnostics
  - Video
  properties:
  - type: Documentation
    url: https://docs.conviva.ai/api/apis/conviva-vsi-api/sessions-v3-api/
- aid: conviva:ai-alerts
  name: Conviva AI Alerts API
  description: Retrieval of AI-driven content and ad alerts, alert diagnostics and impacted-session detail,
    filterable by time range and severity. Endpoints are /insights/2.6/ai-alerts/content-metrics and
    /insights/2.6/ai-alerts/ad-metrics, with per-alert lookup by {alert_id}.
  humanURL: https://docs.conviva.ai/api/apis/conviva-vsi-api/ai-alerts-api-guide/
  baseURL: https://api.conviva.com/insights/2.6/ai-alerts
  tags:
  - Alerts
  - Monitoring
  - AI
  properties:
  - type: Documentation
    url: https://docs.conviva.ai/api/apis/conviva-vsi-api/ai-alerts-api-guide/
- aid: conviva:bulk-filters
  name: Conviva Bulk Filters API
  description: Bulk create, retrieve, update and delete of saved Conviva filters so large filter sets can
    be managed programmatically. Each call processes a maximum of 100 filters.
  humanURL: https://docs.conviva.ai/api/apis/conviva-vsi-api/bulk-filter-api/
  baseURL: https://api.conviva.com/bulk_filters
  tags:
  - Filters
  - Configuration
  properties:
  - type: Documentation
    url: https://docs.conviva.ai/api/apis/conviva-vsi-api/bulk-filter-api/
- aid: conviva:precision-policy
  name: Conviva Precision Policy API
  description: Programmatic control over Conviva Precision policies — retrieve policy definitions and their
    filters and resource shares, activate policies, and reorder Precision filters. POST operations require
    credentials created by a Precision Admin or the API returns 403.
  humanURL: https://docs.conviva.ai/api/apis/conviva-vsi-api/precision-policy-api/
  baseURL: https://api.conviva.com/precision/v1.0/policies
  tags:
  - Policy
  - Configuration
  properties:
  - type: Documentation
    url: https://docs.conviva.ai/api/apis/conviva-vsi-api/precision-policy-api/
- aid: conviva:pii-opt-out
  name: Conviva PII Opt-Out API
  description: Privacy-request surface for marking viewer identifiers for opt-out and deletion of Personally
    Identifiable Information, plus retrieval of opt-out request status. Supports GDPR/CCPA data-subject
    workflows against the Conviva data platform.
  humanURL: https://docs.conviva.ai/api/apis/conviva-vsi-api/pii-opt-out-api/
  baseURL: https://api.conviva.com/pii-opt-out
  tags:
  - Privacy
  - Compliance
  - GDPR
  properties:
  - type: Documentation
    url: https://docs.conviva.ai/api/apis/conviva-vsi-api/pii-opt-out-api/
- aid: conviva:validation-timeline-v2
  name: Conviva Validation Timeline API v2
  description: Session validation timeline data for QA and sensor-integration testing, queried by viewer_id
    and/or session_id, used to verify that a Conviva Sensor integration is emitting the expected event
    timeline before a build ships.
  humanURL: https://docs.conviva.ai/api/apis/conviva-vsi-api/validation-timeline-api-v2/
  baseURL: https://api.conviva.com/validation/v2/timeline
  tags:
  - Validation
  - Testing
  - Integration
  properties:
  - type: Documentation
    url: https://docs.conviva.ai/api/apis/conviva-vsi-api/validation-timeline-api-v2/
- aid: conviva:mcp
  name: Conviva MCP Server
  description: Hosted Model Context Protocol server exposing Conviva VSI and DPI data to agents across five
    sub-services — /vsi/metrics, /vsi/ai-alerts, /vsi/sessions, /dpi/metrics and /dpi/ai-alerts. Protected
    by OAuth 2.1 (authorization_code + PKCE S256, dynamic client registration) or HTTP Basic with a Pulse
    API key; tools/list requires authentication.
  humanURL: https://docs.conviva.ai/connect-data/mcp/
  baseURL: https://mcp.conviva.com/mcp
  tags:
  - MCP
  - Agents
  - Analytics
  properties:
  - type: MCPServer
    url: mcp/conviva-mcp.yml
  - type: Documentation
    url: https://docs.conviva.ai/connect-data/mcp/
  - type: ToolCrosswalk
    url: mcp/conviva-tool-crosswalk.yml
- aid: conviva:dpi-mcp
  name: Conviva DPI MCP Server
  description: Hosted Model Context Protocol server for the Conviva Digital Intelligence Platform, exposing
    /insights, /nexa, /context-center, /session-replay and /metric-query sub-services. Authenticates via
    Okta-backed OAuth 2.1 with dynamic client registration; distributed to agents through Conviva's Claude
    plugin marketplace alongside three provider-authored Agent Skills.
  humanURL: https://github.com/Conviva/mcp-marketplace
  baseURL: https://dpi-mcp.conviva.com/mcp
  tags:
  - MCP
  - Agents
  - Context Center
  properties:
  - type: MCPServer
    url: mcp/conviva-mcp.yml
  - type: AgentSkill
    url: skills/_index.yml
