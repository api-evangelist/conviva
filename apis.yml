x-enrichment-notes:
  no_security_pointer: >-
    No `Security` / `VulnerabilityDisclosure` pointer is emitted. Conviva publishes a security
    posture page (ISO 27001, annual pentest, continuous scanning) but NO coordinated vulnerability
    disclosure channel — no /.well-known/security.txt on any host, no bug bounty, no security@
    address. Recording a disclosure program it does not run would be fabrication.
  no_agent_card: >-
    No `AgentCard` pointer. /.well-known/agent-card.json and /.well-known/agent.json miss on every
    Conviva host (404 on mcp.conviva.com and api.conviva.com, 405 on dpi-mcp.conviva.com). Agent
    cards are search-only and are never authored on a provider's behalf.
  no_idempotency_pointer: >-
    No `Idempotency` pointer. Conviva documents no idempotency key or retry-safety contract for any
    write operation.
  no_openapi: >-
    No OpenAPI/Swagger found after probing /openapi.json, /openapi.yaml, /swagger.json, /api-docs,
    /v1/openapi.json and /redoc on api.conviva.com, docs.conviva.ai, docs.conviva.com and
    developer.conviva.com. Conviva's own APIs page confirms it: the Scalar reference "renders a
    placeholder until specs exist." api.conviva.com/insights/3.0/openapi.json returns 401, which is
    the gateway auth-gating every path under /insights/3.0/, not a gated spec.

