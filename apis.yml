aid: conviva
name: Conviva
description: 'Conviva is the streaming-media and digital-experience analytics company behind Experience-Centric
  Operations (ECO) — a real-time, full-census operational data platform that stitches client-side telemetry
  from its Sensor SDKs into stateful, per-viewer experience analytics for video streamers, broadcasters
  and app publishers. Its Pulse portal is fronted by a public REST surface at api.conviva.com covering
  Metrics V3, Sessions V3, AI Alerts, Bulk Filters, Precision Policy, PII Opt-Out and Validation Timeline,
  plus Conviva Connect session-summary data feeds (S3/GCS/Snowflake/BigQuery/SFTP), alert webhooks, and
  two hosted OAuth-protected Model Context Protocol servers (mcp.conviva.com for VSI/DPI metrics, alerts
  and sessions; dpi-mcp.conviva.com for Context Center, Nexa analysis, metric query and session replay).
  Conviva publishes a large first-party SDK estate — JavaScript/npm, Android/Maven, iOS/CocoaPods+SPM,
  React Native, Node and Python agent SDKs — and a Claude plugin marketplace carrying three provider-authored
  Agent Skills for its DPI MCP server. Authentication across the REST surface is HTTP Basic with a
  client-id/client-secret API key pair generated in Pulse API Management.'
