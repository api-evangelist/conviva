method: searched
source: npm registry search, Maven Central solrsearch, github.com/Conviva, CocoaPods specs repo
description: >-
  Conviva's first-party client-library estate is a SENSOR estate, not an API-client estate. The
  packages below instrument player, app and agent runtimes to SEND telemetry to Conviva; none of
  them is a generated client for the api.conviva.com REST surface, which Conviva expects callers
  to hit directly over HTTPS with Basic auth. Publisher accounts (@convivainc on npm,
  com.conviva.sdk on Maven Central, the Conviva GitHub org) confirm first-party provenance.
  Third-party player-vendor connectors (Bitmovin, THEOplayer, MediaKind) are listed separately and
  are NOT marked official.

registries_probed:
  npm: hit (@convivainc scope)
  maven_central: hit (com.conviva.sdk group)
  cocoapods: hit (github.com/Conviva/Conviva-PodSpecs)
  swift_package_manager: hit (conviva-ios-sdk-spm, conviva-ios-appanalytics-spm, and siblings)
  pypi: miss (no conviva* distribution; the Python Agent SDK ships from GitHub only)
  rubygems: miss
  nuget: miss
  packagist: miss
  crates_io: miss
  pkg_go_dev: miss

