method: searched
source: Conviva API guide pages (per-API "Response Codes" / "Error Codes" tables)
sources:
- https://docs.conviva.ai/api/apis/conviva-vsi-api/precision-policy-api/
- https://docs.conviva.ai/api/apis/conviva-vsi-api/bulk-filter-api/
- https://docs.conviva.ai/api/apis/conviva-vsi-api/ai-alerts-api-guide/
- https://docs.conviva.ai/api/apis/conviva-vsi-api/metrics-v3-api-guide/
