method: searched
source: live probes of /.well-known/* on every Conviva host in apis.yml
description: >-
  Conviva publishes no security.txt, no OpenID Connect discovery and no api-catalog on its
  marketing, docs or REST API hosts. Its entire /.well-known/ surface lives on the two hosted
  MCP servers, which implement RFC 8414 (OAuth 2.0 Authorization Server Metadata) and
  RFC 9728 (OAuth 2.0 Protected Resource Metadata) with dynamic client registration.

hosts:
