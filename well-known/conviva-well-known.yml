    status: 200
    spec: RFC 7517
    file: null
    note: JWKS fetched and verified as a live RSA key set; not archived (keys rotate).
  - path: /.well-known/agent-card.json
    status: 404
  - path: /.well-known/agent.json
    status: 404
  - path: /.well-known/openid-configuration
    status: 404
  - path: /.well-known/security.txt
    status: 404
- host: https://dpi-mcp.conviva.com
  role: MCP server (Context Center, Nexa, metric query, session replay, insights)
  documents:
  - path: /.well-known/oauth-authorization-server
    status: 200
    file: conviva-dpi-mcp-oauth-authorization-server.json
    spec: RFC 8414
  - path: /.well-known/oauth-protected-resource
    status: 200
