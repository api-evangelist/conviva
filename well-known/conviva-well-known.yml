# Non-.well-known discovery endpoints that DO return machine-readable descriptors.
service_descriptors:
- url: https://mcp.conviva.com/mcp
  method: GET
  status: 200
  returns: server name/version + services[] + OAuth authentication block
  services: ["/vsi/metrics", "/vsi/ai-alerts", "/vsi/sessions", "/dpi/metrics", "/dpi/ai-alerts"]
- url: https://dpi-mcp.conviva.com/mcp
  method: GET
  status: 200
  returns: server name/version + services[] + OAuth authentication block
  services: ["/insights", "/nexa", "/context-center", "/session-replay", "/metric-query"]
- url: https://mcp.conviva.com/health
  method: GET
  status: 200
  returns: status, version 1.0.0, environment production, transport http, services[], database
- url: https://dpi-mcp.conviva.com/health
  method: GET
  status: 200
  returns: status, version 1.1.0, environment production, transport http, services[], database
